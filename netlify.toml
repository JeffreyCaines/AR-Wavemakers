[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false

# /api/* is served by netlify/functions/api.ts via its `config.path` binding,
# which preserves the full request path (including /cards/:id and /geocode).

# SPA fallback lives in public/_redirects (copied to dist on build). Do not add
# a catch-all redirect here — netlify dev applies netlify.toml redirects to every
# proxied request, including /src/*.ts, which breaks Vite import analysis.
