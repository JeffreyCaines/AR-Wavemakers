<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MindAR Target Compiler</title>
  </head>
  <body>
    <script type="module">
      import { Compiler } from "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js";

      window.runCompile = async (imageUrl) => {
        const compiler = new Compiler();
        const img = await loadImage(imageUrl);
        await compiler.compileImageTargets([img], (progress) => {
          console.log(`progress ${progress.toFixed(1)}%`);
        });
        const buffer = await compiler.exportData();
        return Array.from(new Uint8Array(buffer));
      };

      function loadImage(url) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("Failed to load reference image"));
          img.src = url;
        });
      }
    </script>
  </body>
</html>
